<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy GM</title>
<!--
  Once your backend is deployed (see README "Deploying"), you can hardcode
  its URL below so the "API base" field defaults to it instead of localhost:
    <input id="apiBase" ... value="https://your-app.onrender.com">
  Just find the id="apiBase" input a few lines down and change its `value`.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
<style>
  body { background:#0f1115; color:#e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { background:#171a21; border:1px solid #262b36; border-radius:12px; }
  .tab-btn.active { background:#2563eb; color:white; }
  .badge-high { background:#065f46; color:#d1fae5; }
  .badge-moderate { background:#78350f; color:#fde68a; }
  .badge-low { background:#7f1d1d; color:#fecaca; }
  .badge-verylow { background:#450a0a; color:#fca5a5; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-6xl mx-auto p-4">

  <header class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-white">🏈 Fantasy GM</h1>
      <p class="text-sm text-gray-400">Decision-support MVP · mock data mode</p>
    </div>
    <div class="flex items-center gap-3 text-sm">
      <label class="text-gray-400">API base</label>
      <input id="apiBase" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs w-56"
             value="https://fantasy-gm-api-bfm3.onrender.com">
      <label class="text-gray-400">League</label>
      <input id="leagueId" type="number" value="1" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 w-14 text-xs">
      <label class="text-gray-400">Team</label>
      <input id="teamId" type="number" value="1" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 w-14 text-xs">
      <label class="text-gray-400">Wk</label>
      <input id="week" type="number" value="1" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 w-12 text-xs">
    </div>
  </header>

  <nav class="flex gap-2 mb-6 flex-wrap">
    <button class="tab-btn active px-4 py-2 rounded-lg text-sm font-medium bg-gray-800" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800" data-tab="draft">Draft Room</button>
    <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800" data-tab="lineup">Start/Sit</button>
    <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800" data-tab="waiver">Waiver Wire</button>
    <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800" data-tab="trade">Trade Analyzer</button>
    <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800" data-tab="league">League Intel</button>
  </nav>

  <div id="content"></div>
</div>

<script>
const $ = sel => document.querySelector(sel);
const apiBase = () => $('#apiBase').value.replace(/\/$/, '');
const leagueId = () => $('#leagueId').value;
const teamId = () => $('#teamId').value;
const week = () => $('#week').value;
const SEASON = 2026;

async function api(path, opts) {
  try {
    const res = await fetch(apiBase() + path, opts);
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`${res.status}: ${text}`);
    }
    return await res.json();
  } catch (e) {
    return { error: e.message };
  }
}

function confidenceBadge(c) {
  const cls = { "Very High": "badge-high", "High": "badge-high", "Moderate": "badge-moderate",
                "Low": "badge-low", "Very Low": "badge-verylow" }[c] || "badge-moderate";
  return `<span class="text-xs px-2 py-0.5 rounded-full ${cls}">${c || "Unknown"} confidence</span>`;
}

function envelopeFooter(d) {
  if (!d) return '';
  const assumptions = (d.assumptions || []).map(a => `<li>${a}</li>`).join('');
  const missing = (d.missing_or_uncertain || []).map(a => `<li>${a}</li>`).join('');
  return `
    <div class="mt-4 pt-3 border-t border-gray-800 text-xs text-gray-500">
      <div class="flex flex-wrap gap-3 mb-2">
        ${confidenceBadge(d.confidence)}
        <span>model: ${d.model_version || 'n/a'}</span>
        <span>source: ${d.data_source || 'n/a'}</span>
        <span>as of: ${d.data_timestamp ? new Date(d.data_timestamp).toLocaleString() : 'n/a'}</span>
      </div>
      ${assumptions ? `<div class="mb-1"><b>Assumptions:</b><ul class="list-disc ml-4">${assumptions}</ul></div>` : ''}
      ${missing ? `<div><b>Missing/uncertain:</b><ul class="list-disc ml-4">${missing}</ul></div>` : ''}
      <div class="mt-2 italic text-gray-600">${d.disclaimer || 'Entertainment and decision-support only. No outcome is guaranteed.'}</div>
    </div>`;
}

function errorCard(msg) {
  return `<div class="card p-4 text-red-400 text-sm">⚠ ${msg}<br><span class="text-gray-500">Is the API running at ${apiBase()}? Try: <code>uvicorn app.main:app --reload</code> after <code>python -m app.seed_mock_data</code>.</span></div>`;
}

// ---------- Dashboard ----------
async function renderDashboard() {
  $('#content').innerHTML = `<div class="text-gray-400 text-sm">Loading dashboard…</div>`;
  const d = await api(`/api/league/${leagueId()}/dashboard?team_id=${teamId()}&season=${SEASON}&week=${week()}`);
  if (d.error) { $('#content').innerHTML = errorCard(d.error); return; }
  const rec = d.recommendation;
  const lineupRows = (rec.recommended_lineup || []).map(p => `
    <tr class="border-b border-gray-800">
      <td class="py-1 pr-3 text-gray-400">${p.slot}</td>
      <td class="py-1 pr-3">${p.name}</td>
      <td class="py-1 pr-3 text-gray-500">${p.position}</td>
      <td class="py-1 text-right">${p.median?.toFixed(1) ?? '-'}</td>
    </tr>`).join('');
  const alerts = (rec.urgent_alerts || []).map(a => `
    <div class="p-2 rounded bg-gray-800 mb-2 text-sm">
      <div class="font-medium">${a.headline}</div>
      <div class="text-gray-400 text-xs">${a.body}</div>
    </div>`).join('') || `<div class="text-gray-500 text-sm">No urgent alerts right now.</div>`;

  $('#content').innerHTML = `
    <div class="grid md:grid-cols-3 gap-4">
      <div class="card p-4 md:col-span-1">
        <div class="text-gray-400 text-xs uppercase mb-1">Team</div>
        <div class="text-xl font-semibold">${rec.team_name}</div>
        <div class="text-3xl font-bold mt-3 text-blue-400">${rec.projected_lineup_score_median ?? '-'}</div>
        <div class="text-gray-500 text-xs">projected lineup score (median)</div>
      </div>
      <div class="card p-4 md:col-span-2">
        <div class="text-gray-400 text-xs uppercase mb-2">Urgent alerts</div>
        ${alerts}
      </div>
    </div>
    <div class="card p-4 mt-4">
      <div class="text-gray-400 text-xs uppercase mb-2">Recommended lineup</div>
      <table class="w-full text-sm"><tbody>${lineupRows || '<tr><td class="text-gray-500 py-2">No roster found for this team — assign players first.</td></tr>'}</tbody></table>
    </div>
    ${envelopeFooter(d)}
  `;
}

// ---------- Draft Room ----------
async function renderDraft() {
  $('#content').innerHTML = `<div class="text-gray-400 text-sm">Loading big board…</div>`;
  const d = await api(`/api/draft/${leagueId()}/big-board?season=${SEASON}&week=${week()}&num_teams=12`);
  if (d.error) { $('#content').innerHTML = errorCard(d.error); return; }
  const rows = d.recommendation.board.slice(0, 40).map((p, i) => `
    <tr class="border-b border-gray-800 hover:bg-gray-800/50">
      <td class="py-1 pr-3 text-gray-500">${i + 1}</td>
      <td class="py-1 pr-3">${p.name}</td>
      <td class="py-1 pr-3 text-gray-500">${p.position}</td>
      <td class="py-1 pr-3 text-right">${p.median?.toFixed(1)}</td>
      <td class="py-1 pr-3 text-right text-gray-500">${p.floor?.toFixed(1)} / ${p.ceiling?.toFixed(1)}</td>
      <td class="py-1 pr-3 text-right font-medium ${p.vorp > 5 ? 'text-emerald-400' : 'text-gray-300'}">${p.vorp?.toFixed(1)}</td>
      <td class="py-1 text-xs text-gray-500">${p.confidence}</td>
    </tr>`).join('');
  $('#content').innerHTML = `
    <div class="card p-4">
      <div class="flex justify-between items-center mb-3">
        <div class="text-gray-400 text-xs uppercase">Draft Big Board — top 40 by VORP</div>
      </div>
      <table class="w-full text-sm">
        <thead class="text-gray-500 text-xs">
          <tr><th class="text-left py-1">#</th><th class="text-left">Player</th><th class="text-left">Pos</th>
          <th class="text-right">Median</th><th class="text-right">Floor/Ceil</th><th class="text-right">VORP</th><th>Conf.</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${envelopeFooter(d)}
  `;
}

// ---------- Lineup ----------
async function renderLineup() {
  $('#content').innerHTML = `<div class="text-gray-400 text-sm">Loading lineup optimizer…</div>`;
  const d = await api(`/api/lineup/optimize?team_id=${teamId()}&season=${SEASON}&week=${week()}`);
  if (d.error) { $('#content').innerHTML = errorCard(d.error); return; }
  const rec = d.recommendation;
  const starters = (rec.lineup || []).map(p => `
    <tr class="border-b border-gray-800">
      <td class="py-1 pr-3 text-gray-400">${p.slot}</td>
      <td class="py-1 pr-3">${p.name}</td>
      <td class="py-1 pr-3 text-gray-500">${p.position}</td>
      <td class="py-1 pr-3 text-xs ${p.status !== 'Active' ? 'text-amber-400' : 'text-gray-500'}">${p.status || ''}</td>
      <td class="py-1 text-right">${p.median?.toFixed(1)}</td>
    </tr>`).join('');
  const wp = rec.win_probability_vs_opponent;
  $('#content').innerHTML = `
    <div class="grid md:grid-cols-3 gap-4 mb-4">
      <div class="card p-4"><div class="text-gray-400 text-xs uppercase">Median</div><div class="text-2xl font-bold">${rec.projected_score_median}</div></div>
      <div class="card p-4"><div class="text-gray-400 text-xs uppercase">Floor (p10) / Ceiling (p90)</div><div class="text-2xl font-bold">${rec.projected_score_floor_p10} / ${rec.projected_score_ceiling_p90}</div></div>
      <div class="card p-4"><div class="text-gray-400 text-xs uppercase">Win probability</div><div class="text-2xl font-bold">${wp ? (wp.team_a_win_prob * 100).toFixed(0) + '%' : 'n/a (no opponent set)'}</div></div>
    </div>
    <div class="card p-4 mb-4">
      <div class="text-gray-400 text-xs uppercase mb-2">Why this lineup?</div>
      <p class="text-sm text-gray-300">${rec.why_this_lineup}</p>
      ${(rec.notes || []).map(n => `<p class="text-xs text-gray-500 mt-2">${n}</p>`).join('')}
    </div>
    <div class="card p-4">
      <div class="text-gray-400 text-xs uppercase mb-2">Starting lineup</div>
      <table class="w-full text-sm"><tbody>${starters || '<tr><td class="text-gray-500 py-2">No roster found.</td></tr>'}</tbody></table>
    </div>
    ${envelopeFooter(d)}
  `;
}

// ---------- Waiver ----------
async function renderWaiver() {
  $('#content').innerHTML = `
    <div class="card p-4 mb-4">
      <div class="text-gray-400 text-xs uppercase mb-2">Free agent player IDs (comma-separated, mock DB has players with ids 1-416+)</div>
      <div class="flex gap-2">
        <input id="faIds" class="flex-1 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm" value="100,101,102,103,104,105">
        <button id="runWaiver" class="bg-blue-600 hover:bg-blue-500 px-4 py-1 rounded text-sm">Run</button>
      </div>
    </div>
    <div id="waiverResults" class="text-gray-500 text-sm">Enter free agent IDs and click Run.</div>
  `;
  $('#runWaiver').onclick = async () => {
    const ids = $('#faIds').value.split(',').map(s => parseInt(s.trim())).filter(Boolean);
    $('#waiverResults').innerHTML = `<div class="text-gray-400">Computing…</div>`;
    const d = await api(`/api/waiver/recommend`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ team_id: parseInt(teamId()), league_id: parseInt(leagueId()), season: SEASON,
                              week: parseInt(week()), free_agent_player_ids: ids, faab_remaining: 100 })
    });
    if (d.error) { $('#waiverResults').innerHTML = errorCard(d.error); return; }
    const rows = d.recommendation.recommended_adds.map(p => `
      <tr class="border-b border-gray-800">
        <td class="py-1 pr-3">${p.name}</td>
        <td class="py-1 pr-3 text-gray-500">${p.position}</td>
        <td class="py-1 pr-3 text-right">${p.rest_of_season_value}</td>
        <td class="py-1 pr-3 text-right text-emerald-400">${p.suggested_faab_bid}</td>
        <td class="py-1 pr-3 text-right text-gray-500">${p.conservative_faab_bid} / ${p.aggressive_faab_bid}</td>
        <td class="py-1 text-right text-xs text-gray-500">${(p.estimated_claim_probability_by_others * 100).toFixed(0)}%</td>
      </tr>`).join('');
    $('#waiverResults').innerHTML = `
      <div class="card p-4">
        <div class="text-gray-400 text-xs uppercase mb-2">Recommended adds (ranked by rest-of-season value)</div>
        <table class="w-full text-sm">
          <thead class="text-gray-500 text-xs"><tr><th class="text-left">Player</th><th class="text-left">Pos</th>
          <th class="text-right">ROS value</th><th class="text-right">Suggested FAAB</th><th class="text-right">Cons./Aggr.</th><th class="text-right">Claim odds</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${envelopeFooter(d)}
    `;
  };
}

// ---------- Trade ----------
async function renderTrade() {
  $('#content').innerHTML = `
    <div class="card p-4 mb-4">
      <div class="text-gray-400 text-xs uppercase mb-2">Simple 2-team trade (player IDs)</div>
      <div class="grid md:grid-cols-2 gap-3 text-sm">
        <div>
          <label class="text-gray-500 text-xs">Team A id</label>
          <input id="teamA" class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 mb-2" value="1">
          <label class="text-gray-500 text-xs">Team A sends (comma ids)</label>
          <input id="aSends" class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1" value="3">
        </div>
        <div>
          <label class="text-gray-500 text-xs">Team B id</label>
          <input id="teamB" class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 mb-2" value="2">
          <label class="text-gray-500 text-xs">Team B sends (comma ids)</label>
          <input id="bSends" class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1" value="100">
        </div>
      </div>
      <button id="runTrade" class="mt-3 bg-blue-600 hover:bg-blue-500 px-4 py-1 rounded text-sm">Analyze trade</button>
    </div>
    <div id="tradeResults" class="text-gray-500 text-sm">Fill in both sides and analyze.</div>
  `;
  $('#runTrade').onclick = async () => {
    const teamAId = parseInt($('#teamA').value), teamBId = parseInt($('#teamB').value);
    const aSends = $('#aSends').value.split(',').map(s => parseInt(s.trim())).filter(Boolean);
    const bSends = $('#bSends').value.split(',').map(s => parseInt(s.trim())).filter(Boolean);
    const payload = { league_id: parseInt(leagueId()), season: SEASON, week: parseInt(week()),
      team_assets: { [teamAId]: { sends: aSends, receives: bSends }, [teamBId]: { sends: bSends, receives: aSends } } };
    $('#tradeResults').innerHTML = `<div class="text-gray-400">Computing…</div>`;
    const d = await api(`/api/trade/analyze`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (d.error) { $('#tradeResults').innerHTML = errorCard(d.error); return; }
    const rec = d.recommendation;
    const teamCards = Object.values(rec.per_team_impact).map(t => `
      <div class="card p-4">
        <div class="text-gray-400 text-xs uppercase mb-1">Team ${t.team_id}</div>
        <div class="text-sm">Starter value: <b>${t.starter_value_before}</b> → <b>${t.starter_value_after}</b></div>
        <div class="text-xl font-bold ${t.starter_value_delta >= 0 ? 'text-emerald-400' : 'text-red-400'}">${t.starter_value_delta >= 0 ? '+' : ''}${t.starter_value_delta}</div>
      </div>`).join('');
    $('#tradeResults').innerHTML = `
      <div class="card p-4 mb-4"><div class="text-gray-400 text-xs uppercase mb-1">Verdict</div><div class="text-lg">${rec.verdict}</div></div>
      <div class="grid md:grid-cols-2 gap-4 mb-4">${teamCards}</div>
      ${rec.counteroffer_suggestions.length ? `<div class="card p-4 mb-4"><div class="text-gray-400 text-xs uppercase mb-1">Counteroffer ideas</div><ul class="list-disc ml-4 text-sm">${rec.counteroffer_suggestions.map(c => `<li>${c}</li>`).join('')}</ul></div>` : ''}
      ${envelopeFooter(d)}
    `;
  };
}

// ---------- League Intel ----------
async function renderLeague() {
  $('#content').innerHTML = `<div class="text-gray-400 text-sm">Loading season simulation…</div>`;
  const d = await api(`/api/league/${leagueId()}/season-simulation?n_sims=1000`);
  if (d.error) { $('#content').innerHTML = errorCard(d.error); return; }
  const rows = d.recommendation.teams
    .sort((a, b) => b.playoff_probability - a.playoff_probability)
    .map(t => `
    <tr class="border-b border-gray-800">
      <td class="py-1 pr-3">${t.team_name}</td>
      <td class="py-1 pr-3 text-right">${(t.playoff_probability * 100).toFixed(1)}%</td>
      <td class="py-1 text-right text-gray-500">${(t.championship_probability_proxy * 100).toFixed(1)}%</td>
    </tr>`).join('');
  $('#content').innerHTML = `
    <div class="card p-4">
      <div class="text-gray-400 text-xs uppercase mb-2">Playoff & championship odds (simulated)</div>
      <table class="w-full text-sm">
        <thead class="text-gray-500 text-xs"><tr><th class="text-left">Team</th><th class="text-right">Playoff %</th><th class="text-right">Championship % (proxy)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${envelopeFooter(d)}
  `;
}

const renderers = { dashboard: renderDashboard, draft: renderDraft, lineup: renderLineup,
                     waiver: renderWaiver, trade: renderTrade, league: renderLeague };

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderers[btn.dataset.tab]();
  });
});

renderDashboard();
</script>
</body>
</html>
